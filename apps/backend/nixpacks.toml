# Nixpacks config for Dokploy — use pnpm, staged build without cache mount
# This ensures Dokploy/Nixpacks detects pnpm (via pnpm-lock.yaml) and runs pnpm, not npm

[phases.setup]
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = ["pnpm install"]
cacheDirectories = []

[phases.build]
cmds = ["pnpm build"]
cacheDirectories = []

[providers]
# Force Node provider, disable auto cache
